# Development Environment Overrides
# Use with: helm install axion ./helm/axion -f ./helm/axion/values-dev.yaml

postgres:
  replicaCount: 1
  service:
    type: ClusterIP
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

ingestion:
  replicaCount: 1
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

telemetryQuery:
  replicaCount: 1
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

simulator:
  replicaCount: 1
  resources:
    limits:
      cpu: "100m"
      memory: "128Mi"
    requests:
      cpu: "20m"
      memory: "32Mi"

ui:
  replicaCount: 1
  resources:
    limits:
      cpu: "150m"
      memory: "128Mi"
    requests:
      cpu: "30m"
      memory: "32Mi"

ingress:
  enabled: false # Typically disabled or using local port-forwarding/nginx in dev
