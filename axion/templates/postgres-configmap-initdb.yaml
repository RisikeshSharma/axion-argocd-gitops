{{- if and .Values.postgres.enabled .Values.postgres.initdb.enabled (not .Values.postgres.externalDatabase.enabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "axion.fullname" . }}-postgres-initdb
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "axion.labels" . | nindent 4 }}
    app: postgres
data:
  01-extensions.sql: |
    -- ============================================
    -- Axion - Extensions
    -- ============================================
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

  02-telemetry.sql: |
    -- ============================================
    -- Axion - Telemetry Table & Indexes
    -- ============================================
    CREATE TABLE IF NOT EXISTS telemetry (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        device_id VARCHAR(50) NOT NULL,
        device_type VARCHAR(20) NOT NULL,
        refinery_region VARCHAR(50) NOT NULL,
        timestamp TIMESTAMP NOT NULL,
        temperature DOUBLE PRECISION NOT NULL,
        vibration DOUBLE PRECISION NOT NULL,
        current DOUBLE PRECISION NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_telemetry_device_id
    ON telemetry(device_id);

    CREATE INDEX IF NOT EXISTS idx_telemetry_timestamp
    ON telemetry(timestamp DESC);

  03-alerts.sql: |
    -- ============================================
    -- Axion - Alerts Table & Indexes
    -- ============================================
    CREATE TABLE IF NOT EXISTS alerts (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        device_id VARCHAR(50) NOT NULL,
        severity VARCHAR(20) NOT NULL,
        message TEXT NOT NULL,
        timestamp TIMESTAMP NOT NULL,
        acknowledged BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_alerts_device_id
    ON alerts(device_id);

    CREATE INDEX IF NOT EXISTS idx_alerts_acknowledged
    ON alerts(acknowledged);

    CREATE INDEX IF NOT EXISTS idx_alerts_timestamp
    ON alerts(timestamp DESC);
{{- end }}
