{{- if .Values.ingestion.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axion.ingestionServiceName" . }}
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "axion.labels" . | nindent 4 }}
    app: ingestion
spec:
  type: {{ .Values.ingestion.service.type }}
  selector:
    app: ingestion
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.ingestion.service.port }}
      targetPort: {{ .Values.ingestion.service.targetPort }}
{{- end }}
