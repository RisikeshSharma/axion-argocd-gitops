{{- if and .Values.postgres.enabled (not .Values.postgres.externalDatabase.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axion.fullname" . }}-postgres-secret
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "axion.labels" . | nindent 4 }}
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
{{- end }}
