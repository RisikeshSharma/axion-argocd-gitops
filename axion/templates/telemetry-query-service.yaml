{{- if .Values.telemetryQuery.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axion.telemetryQueryServiceName" . }}
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "axion.labels" . | nindent 4 }}
    app: telemetry-query
spec:
  type: {{ .Values.telemetryQuery.service.type }}
  selector:
    app: telemetry-query
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.telemetryQuery.service.port }}
      targetPort: {{ .Values.telemetryQuery.service.targetPort }}
{{- end }}
