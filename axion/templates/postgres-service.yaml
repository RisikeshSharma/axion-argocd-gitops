{{- if and .Values.postgres.enabled (not .Values.postgres.externalDatabase.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axion.postgresServiceName" . }}
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "axion.labels" . | nindent 4 }}
    app: postgres
spec:
  type: {{ .Values.postgres.service.type }}
  selector:
    app: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.targetPort }}
{{- end }}
