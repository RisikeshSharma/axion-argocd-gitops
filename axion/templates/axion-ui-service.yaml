{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axion.uiServiceName" . }}
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "axion.labels" . | nindent 4 }}
    app: axion-ui
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    app: axion-ui
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.ui.service.port }}
      targetPort: {{ .Values.ui.service.targetPort }}
{{- end }}
